<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a5240">
<title>VK Accounts</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--g:#1f5f4a;--gd:#174a39;--gold:#e2b33c;--bg:#f3f5f2;--card:#fff;--tx:#1b2420;--mu:#68776f;--line:#e3e9e5;--warn:#a8670a;--bad:#c0392b;--ok:#1e8e5a}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:84px}
header{background:linear-gradient(180deg,#22694f,var(--gd));color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
header .lg{width:38px;height:38px;flex:none}header .lg svg{width:100%;height:100%}
header .tt{flex:1;min-width:0}header h1{margin:0;font-size:17px;letter-spacing:.2px}header small{opacity:.8;font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role{font-size:10.5px;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.16);white-space:nowrap}.role.ad{background:var(--gold);color:#3b2c05;font-weight:700}
main{padding:14px;max-width:760px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 2px 10px;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;position:relative}
nav button .i{font-size:20px}nav button.on{color:var(--g);font-weight:700}
nav .bd{position:absolute;top:4px;left:55%;background:var(--bad);color:#fff;font-size:10px;border-radius:9px;padding:0 5px;font-weight:700}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);min-width:0}
.stat b{display:block;font-size:16px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat span{font-size:11px;color:var(--mu)}
.stat.big{background:var(--g);color:#fff}.stat.big span{color:#cfe5dc}
.btn{border:0;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:600;background:var(--g);color:#fff;cursor:pointer;font-family:inherit}
.btn.sec{background:#e4eee9;color:var(--g)}.btn.bad{background:#fbe9e7;color:var(--bad)}.btn.gold{background:var(--gold);color:#3b2c05}.btn.sm{padding:7px 10px;font-size:12.5px}.btn.full{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:8px}
.item:last-child{border:0}.item .t{font-weight:600;font-size:14px}.item .s{font-size:12px;color:var(--mu);margin-top:2px}
.tap{cursor:pointer}
.amt{font-weight:700;white-space:nowrap}.in{color:var(--ok)}.out{color:var(--bad)}.tr{color:#5a6bb0}
.chip{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600;white-space:nowrap;display:inline-block}
.chip.ok{background:#e3f4ea;color:var(--ok)}.chip.pend{background:#fff3dc;color:var(--warn)}.chip.no{background:#fdeceb;color:var(--bad)}.chip.x{background:#eee;color:#777}.chip.old{background:#eef0f7;color:#5a6bb0}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:10px;border:1px solid #cfd8d3;border-radius:9px;font-size:15px;background:#fff;color:var(--tx);font-family:inherit}
input[type=checkbox],input[type=radio]{width:auto}
h2{font-size:16px;margin:4px 0 10px}h3{margin:0 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;font-size:12px}
.seg{display:flex;background:#e3ebe7;border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:8px;font-weight:600;color:var(--mu);font-size:13px;font-family:inherit}
.seg button.on{background:#fff;color:var(--g)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 28px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.x{border:0;background:#eef2f0;border-radius:50%;width:32px;height:32px;font-size:18px;flex:none}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:85%;text-align:center}
#toast.on{opacity:1}
.banner{background:#fff3dc;color:#6e4705;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.banner.info{background:#e7f0fb;color:#1d4673}
.empty{text-align:center;color:var(--mu);padding:22px 8px;font-size:14px}
img.rc{width:100%;border-radius:8px;border:1px solid var(--line)}
.muted{color:var(--mu);font-size:12px}.warn{color:var(--bad);font-size:12.5px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.fgrid button{border:1px solid #cfd8d3;background:#fff;border-radius:8px;padding:8px 0;font-weight:700;font-size:14px;color:var(--tx);font-family:inherit}
.fgrid button.on{background:var(--g);border-color:var(--g);color:#fff}
.radio{display:flex;gap:8px;align-items:flex-start;padding:10px;border:1px solid #cfd8d3;border-radius:9px;margin-top:6px;font-size:14px}
.radio input{margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid #e5e5e5;text-align:left;vertical-align:top}td.r,th.r{text-align:right}
footer{text-align:center;color:var(--mu);font-size:11.5px;padding:8px 0 4px}
.gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:linear-gradient(180deg,#22694f,var(--gd));color:#fff}
.gate .lg{width:110px;height:110px;margin-bottom:16px}.gate h1{font-size:22px;margin:0 0 4px}.gate p{opacity:.85;font-size:14px;max-width:340px}
.gate .btn{background:#fff;color:var(--gd);margin-top:16px;padding:13px 22px;font-size:15px}
.gate footer{color:#cfe5dc;margin-top:28px}
.bar{height:8px;background:#e8eeeb;border-radius:4px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ok)}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block;padding:10px;font-size:12px}body{background:#fff;padding:0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal" hidden onclick="if(event.target===this)closeM()"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<div id="print"></div>
<script>
/* =====================================================================
   SETUP — paste your Firebase web config below (see SETUP.md).
   Leave FIREBASE_CONFIG = null to try the app in "this phone only" mode.
   ===================================================================== */
const FIREBASE_CONFIG = null;
const ADMIN_EMAIL = 'bg.manu6@gmail.com';   // only this Google account can add / edit / issue receipts
/* ===================================================================== */

const LOGO_SVG=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="lgbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22694f"/><stop offset="1" stop-color="#174a39"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#lgbg)"/><path d="M118 400V170l92-46v276z" fill="#f4ecd8"/><path d="M210 400V124l120 52v224z" fill="#e6dcc2"/><g fill="#174a39"><rect x="140" y="190" width="22" height="26" rx="3"/><rect x="172" y="178" width="22" height="26" rx="3"/><rect x="140" y="236" width="22" height="26" rx="3"/><rect x="172" y="236" width="22" height="26" rx="3"/><rect x="140" y="282" width="22" height="26" rx="3"/><rect x="172" y="282" width="22" height="26" rx="3"/><rect x="234" y="180" width="24" height="26" rx="3"/><rect x="276" y="196" width="24" height="26" rx="3"/><rect x="234" y="232" width="24" height="26" rx="3"/><rect x="276" y="240" width="24" height="26" rx="3"/><rect x="155" y="340" width="34" height="60" rx="4"/></g><rect x="96" y="398" width="256" height="14" rx="7" fill="#f4ecd8"/><circle cx="352" cy="338" r="86" fill="#e2b33c" stroke="#174a39" stroke-width="12"/><path d="M310 290h84M310 318h84M322 290c52 0 52 56 0 56h-10l60 60" fill="none" stroke="#174a39" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const LOGO_IMG=new Image();LOGO_IMG.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(LOGO_SVG);

const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const CATS=['Security salary','Sweeper salary','EB bill','Electrical work','Plumbing work','Motor / pump','Drainage','Tank / sump cleaning','Metro water / Corporation','Civil / repair work','Supplies / consumables','Festival bonus','Bank charges','Other'];
const KINDS=['Maintenance','Special levy / Corpus','Other income'];
const MODES=['Cash','UPI','Bank transfer','Cheque'];
const CREDIT='Crafted by Manu Brahma · © '+new Date().getFullYear()+' Manu Brahma';

/* ---------- starting data from Form VI register & old Excel ---------- */
let FLAT_SEED=[];
let LEDGER_SEED=[];
const SETTINGS_SEED={assoc:'Kottur Vishwakamal Apartments Welfare Association',short:'VK Accounts',regno:'272/1992',addr:'No. 7/11, 4th Main Road Extension, Kottur Gardens, Kottur, Chennai – 600085',collector:'Manu',designation:'',amount:1500,openDate:'2026-04-01',openBank:30785,openCash:0,prefix:'VK/',nextNo:1,duesStart:'2026-11'};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
const curYM=()=>today().slice(0,7);
const fd=iso=>{if(!iso)return'';const[y,m,d]=iso.split('-');return d+'-'+m+'-'+y};
const ml=x=>{const[y,m]=x.split('-');return MON[+m-1]+' '+y};
function addM(x,k){let[y,m]=x.split('-').map(Number);m+=k-1;y+=Math.floor(m/12);m=((m%12)+12)%12+1;return y+'-'+String(m).padStart(2,'0')}
function monthsBetween(a,b){const o=[];if(!a||!b||a>b)return o;let m=a;while(m<=b&&o.length<240){o.push(m);m=addM(m,1)}return o}
const inr=n=>'₹'+(+n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function fyStart(d){const[y,m]=(d||today()).split('-').map(Number);return (m>=4?y:y-1)+'-04-01'}
function fyLabel(d){const y=+fyStart(d).slice(0,4);return y+'-'+String(y+1).slice(2)}
const clean=o=>JSON.parse(JSON.stringify(o));
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2400)}
function modal(h){$('#sheet').innerHTML=h;$('#modal').hidden=false;$('#sheet').scrollTop=0}
function closeM(){$('#modal').hidden=true}
function words(n){n=Math.round(+n||0);if(!n)return'Zero';const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');const three=x=>x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' '+two(x%100):''):two(x);let s='';const cr=Math.floor(n/1e7);n%=1e7;const l=Math.floor(n/1e5);n%=1e5;const t=Math.floor(n/1000);n%=1000;if(cr)s+=three(cr)+' Crore ';if(l)s+=two(l)+' Lakh ';if(t)s+=two(t)+' Thousand ';if(n)s+=three(n);return s.trim()}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}

/* ---------- state & data layer ---------- */
const LKEY='vkAccounts_local_v1';
let D={settings:{},flats:[],payments:[],expenses:[],users:[]};
let FB=null, ME={email:'',name:'',admin:false,post:''}, READY=false;
const S=()=>D.settings;
const isAdmin=()=>ME.admin;

function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(D))}catch(e){alert('Could not save on this phone. Please download a backup.')}}
function loadLocal(){try{const r=JSON.parse(localStorage.getItem(LKEY));if(r&&r.settings)D=Object.assign(D,r)}catch(e){}}

const DB={
 async put(col,obj){obj=clean(obj);obj.by=ME.email||'local';obj.at=Date.now();
  if(FB){await FB.db.collection(col).doc(obj.id).set(obj)}else{const a=D[col];const i=a.findIndex(x=>x.id===obj.id);if(i>=0)a[i]=obj;else a.push(obj);saveLocal();render()}},
 async del(col,id){if(FB){await FB.db.collection(col).doc(id).delete()}else{D[col]=D[col].filter(x=>x.id!==id);saveLocal();render()}},
 async settings(patch){patch=clean(patch);if(FB){await FB.db.collection('settings').doc('main').set(patch,{merge:true})}else{Object.assign(D.settings,patch);saveLocal();render()}},
 async nextReceiptNo(){if(FB){const ref=FB.db.collection('settings').doc('main');return FB.db.runTransaction(async t=>{const d=await t.get(ref);const x=d.data()||{};const n=+x.nextNo||1;t.set(ref,{nextNo:n+1},{merge:true});return (x.prefix??SETTINGS_SEED.prefix)+String(n).padStart(4,'0')})}
  const n=+S().nextNo||1;S().nextNo=n+1;saveLocal();return (S().prefix||'')+String(n).padStart(4,'0')},
 async batch(items){/* items: [col, obj] */ if(FB){for(let i=0;i<items.length;i+=400){const b=FB.db.batch();items.slice(i,i+400).forEach(([c,o])=>{o=clean(o);o.by=ME.email;o.at=Date.now();b.set(FB.db.collection(c).doc(o.id),o)});await b.commit()}}else{items.forEach(([c,o])=>{const a=D[c];const i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;else a.push(o)});saveLocal();render()}}
};

/* ---------- domain helpers ---------- */
const flat=id=>D.flats.find(f=>f.id===id);
const flatsSorted=()=>D.flats.slice().sort((a,b)=>String(a.no).localeCompare(String(b.no),undefined,{numeric:true}));
const flatNos=ids=>(ids||[]).map(id=>flat(id)?.no??'?').sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true}));
function payerName(p){return p.payerName||(p.flats&&p.flats.length?flat(p.flats[0])?.owner:'')||''}
function payerLine(p){const n=flatNos(p.flats);const nm=payerName(p);return n.length?('Flat '+n.join(', ')+(nm?' – '+nm:'')):(nm||'—')}
function period(p){if(p.kind!=='Maintenance')return p.kind+(p.purpose?' – '+p.purpose:'');if(!p.months||!p.months.length)return p.text||'Maintenance';const a=p.months[0],b=p.months[p.months.length-1];return 'Maintenance for '+(a===b?ml(a):ml(a)+' to '+ml(b))}
function covers(fid,m){let pend=null;for(const p of D.payments){if(p.status==='cancelled'||p.kind!=='Maintenance'||!(p.flats||[]).includes(fid)||!(p.months||[]).includes(m))continue;if(p.status==='confirmed')return{s:'paid',p};pend=p}return pend?{s:'pend',p:pend}:{s:'no'}}
function dueFrom(f){return f.duesFrom||S().duesStart||curYM()}
function arrears(f,upto){if(f.collect===false)return[];return monthsBetween(dueFrom(f),upto||curYM()).filter(m=>covers(f.id,m).s==='no')}
function nextDue(fid){const f=flat(fid);if(!f)return curYM();let max=null;D.payments.forEach(p=>{if(p.status!=='cancelled'&&p.kind==='Maintenance'&&(p.flats||[]).includes(fid))(p.months||[]).forEach(m=>{if(!max||m>max)max=m})});const ar=arrears(f);if(ar.length)return ar[0];return max?addM(max,1):dueFrom(f)}
function bal(){let bank=+S().openBank||0,cash=+S().openCash||0;
 D.payments.forEach(p=>{if(p.status!=='confirmed')return;if(p.mode==='Cash')cash+=+p.amount;else bank+=+p.amount});
 D.expenses.forEach(e=>{const a=+e.amount;if(e.type==='transfer'){if(e.from==='Cash'){cash-=a;bank+=a}else{bank-=a;cash+=a}}else if(e.mode==='Cash')cash-=a;else bank-=a});
 return{bank,cash,total:bank+cash}}
function ledger(){const L=[];
 D.payments.forEach(p=>{if(p.status==='confirmed')L.push({d:p.date,type:'in',t:p.legacy?p.text:payerLine(p),s:(p.legacy?'Old ledger':period(p))+' · '+(p.mode==='Cash'?'Cash':p.mode),a:+p.amount,rc:p.rcptNo,o:p,col:'payments'})});
 D.expenses.forEach(e=>{if(e.type==='transfer')L.push({d:e.date,type:'tr',t:e.from==='Cash'?'Cash deposited to account':'Cash withdrawn from account',s:e.note||'Transfer',a:+e.amount,o:e,col:'expenses'});
  else L.push({d:e.date,type:'out',t:e.legacy?e.text:(e.cat+(e.desc?' – '+e.desc:'')),s:(e.legacy?e.cat+' · Old ledger':(e.paidTo?'To '+e.paidTo+' · ':'')+(e.mode==='Cash'?'Cash':'From account')),a:+e.amount,o:e,col:'expenses'})});
 return L.sort((x,y)=>y.d.localeCompare(x.d)||((y.o.at||0)-(x.o.at||0)))}

/* ---------- UI shell ---------- */
let tab='home',sub={},q='';
const TABS=[['home','🏠','Home'],['ledger','📒','Ledger'],['dues','📋','Dues'],['receipts','🧾','Receipts'],['more','⚙️','More']];
function shell(){$('#app').innerHTML=`<header><div class="lg">${LOGO_SVG}</div><div class="tt"><h1 id="hname"></h1><small id="hsub"></small></div><span id="hrole" class="role"></span></header><main id="view"></main><nav>${TABS.map(([k,i,l])=>`<button data-tab="${k}" onclick="go('${k}')"><span class="i">${i}</span>${l}<span class="bd" id="bd_${k}" hidden></span></button>`).join('')}</nav>`}
function go(t,s){tab=t;if(s!==undefined)sub[t]=s;if(t==='more'&&s===undefined)sub.more='menu';render();scrollTo(0,0)}
function render(){if(!READY||!$('#view'))return;
 $('#hname').textContent=S().short||'VK Accounts';$('#hsub').textContent=S().assoc||'';
 const r=$('#hrole');r.textContent=isAdmin()?'Admin':(ME.post||'Viewer');r.className='role'+(isAdmin()?' ad':'');
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
 const pc=D.payments.filter(p=>p.status==='pending').length;const bd=$('#bd_receipts');bd.hidden=!pc;bd.textContent=pc;
 ({home:vHome,ledger:vLedger,dues:vDues,receipts:vReceipts,more:vMore})[tab]()}
const foot=()=>`<footer>${CREDIT}</footer>`;

/* ---------- HOME ---------- */
function vHome(){const b=bal(),m=curYM(),fy=fyStart();
 let cin=0,cout=0,fin=0,fout=0;
 D.payments.forEach(p=>{if(p.status!=='confirmed')return;if(p.date.slice(0,7)===m)cin+=+p.amount;if(p.date>=fy)fin+=+p.amount});
 D.expenses.forEach(e=>{if(e.type==='transfer')return;if(e.date.slice(0,7)===m)cout+=+e.amount;if(e.date>=fy)fout+=+e.amount});
 const act=D.flats.filter(f=>f.collect!==false);const paid=act.filter(f=>covers(f.id,m).s==='paid').length;
 const pend=D.payments.filter(p=>p.status==='pending');
 let h='';
 if(!D.flats.length){h+=isAdmin()?`<div class="card"><h2>Welcome! Load your association data</h2><p class="muted" style="font-size:13.5px">Choose the file <b>vk-starting-data.json</b> (keep it on your phone, don't upload it to GitHub). It loads the 29 flats from Form VI and the FY 2026-27 entries from your Excel, with the balance ending at ₹33,011.</p><label class="btn full" style="display:block;text-align:center;color:#fff;margin:0">Choose starting data file<input type="file" accept=".json,application/json" hidden onchange="seedFile(this.files[0])"></label><button class="btn sec full" style="margin-top:8px" onclick="go('more','settings')">Skip – start empty</button></div>`:`<div class="banner info">The admin hasn't set up the data yet.</div>`}
 if(!FB&&isAdmin())h+=`<div class="banner">📱 <b>This-phone-only mode.</b> Data stays on this phone and other office bearers can't see it yet. See SETUP.md to connect Firebase. Take backups from More → Backup.</div>`;
 h+=`<div class="grid3"><div class="stat big"><span>Total balance</span><b>${inr(b.total)}</b></div><div class="stat"><span>In account</span><b>${inr(b.bank)}</b></div><div class="stat"><span>Cash in hand</span><b>${inr(b.cash)}</b></div></div>`;

function lines(g,text,maxW){const ws=String(text||'').split(' ');const out=[];let line='';for(const w of ws){const t=line?line+' '+w:w;if(g.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t}out.push(line);return out}
function wrap(g,text,x,y,maxW,lh){lines(g,text,maxW).forEach(l=>{g.fillText(l,x,y);y+=lh});return y}
function drawReceipt(p){const s=S(),W=900,c=document.createElement('canvas');c.width=W;c.height=2000;const g=c.getContext('2d');
 g.fillStyle='#fff';g.fillRect(0,0,W,2000);

 else{const list=fl.map(f=>({f,a:arrears(f)})).filter(x=>x.a.length).sort((x,y)=>y.a.length-x.a.length);const tot=list.reduce((s,x)=>s+x.a.length,0)*(+S().amount||0);
  h+=`<div class="card"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0">Total pending up to ${ml(curYM())}</h3><div class="amt out" style="font-size:20px;margin-top:4px">${inr(tot)}</div></div><div class="muted" style="text-align:right">${list.length} flats</div></div></div>

  <p class="muted">Dues are counted from each flat's “Dues tracking from” month (More → Flats). Old payments from the Excel have no months, so tracking starts ${ml(S().duesStart||curYM())} unless you change it per flat.</p>`}
 $('#view').innerHTML=h+foot()}
function remind(fid){const s=S(),f=flat(fid),a=arrears(f);const msg=`Dear ${f.owner||'Resident'},\nGentle reminder: maintenance for Flat ${f.no} is pending for ${a.length>1?a.length+' months ('+ml(a[0])+' to '+ml(a[a.length-1])+')':ml(a[0]||curYM())} – ${inr(Math.max(1,a.length)*(+s.amount||0))}.\nKindly pay as usual (UPI or cash). Please ignore if already paid.\n\nThank you,\n${s.collector||''}${s.designation?', '+s.designation:''}\n${s.assoc}`;

function stmtData(from,to){let open=(+S().openBank||0)+(+S().openCash||0);const inc=[],exp=[];
 D.payments.forEach(p=>{if(p.status!=='confirmed')return;if(p.date<from)open+=+p.amount;else if(p.date<=to)inc.push(p)});
 D.expenses.forEach(e=>{if(e.type==='transfer')return;if(e.date<from)open-=+e.amount;else if(e.date<=to)exp.push(e)});
 const ti=inc.reduce((s,p)=>s+ +p.amount,0),te=exp.reduce((s,e)=>s+ +e.amount,0);const byCat={},byKind={};exp.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+ +e.amount);inc.forEach(p=>byKind[p.kind]=(byKind[p.kind]||0)+ +p.amount);
 return{open,inc:inc.sort((a,b)=>a.date.localeCompare(b.date)),exp:exp.sort((a,b)=>a.date.localeCompare(b.date)),ti,te,byCat,byKind,close:open+ti-te}}
function stmtHTML(from,to,full){const d=stmtData(from,to);let h=`<table><tr><td>Opening balance (${fd(from)})</td><td class="r">${inr(d.open)}</td></tr><tr><td>Income received</td><td class="r in">+${inr(d.ti)}</td></tr><tr><td>Expenses</td><td class="r out">−${inr(d.te)}</td></tr><tr><th>Closing balance (${fd(to)})</th><th class="r">${inr(d.close)}</th></tr></table>`;
 if(Object.keys(d.byKind).length)h+=`<h3 style="margin-top:14px">Income by type</h3><table>${Object.entries(d.byKind).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${inr(v)}</td></tr>`).join('')}</table>`;
 if(Object.keys(d.byCat).length)h+=`<h3 style="margin-top:14px">Expenses by category</h3><table>${Object.entries(d.byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${inr(v)}</td></tr>`).join('')}</table>`;
 if(full){h+=`<h3 style="margin-top:14px">Income</h3><table><tr><th>Date</th><th>Receipt</th><th>Particulars</th><th>Mode</th><th class="r">Amount</th></tr>${d.inc.map(p=>`<tr><td>${fd(p.date)}</td><td>${esc(p.rcptNo||'')}</td><td>${esc(p.legacy&&!p.rcptNo?p.text:payerLine(p)+' – '+period(p))}</td><td>${esc(p.mode)}</td><td class="r">${inr(p.amount)}</td></tr>`).join('')}</table>
 <h3 style="margin-top:14px">Expenses</h3><table><tr><th>Date</th><th>Category</th><th>Details</th><th>Mode</th><th class="r">Amount</th></tr>${d.exp.map(e=>`<tr><td>${fd(e.date)}</td><td>${esc(e.cat)}</td><td>${esc(e.legacy?e.text:e.desc)}${e.paidTo?' – '+esc(e.paidTo):''}</td><td>${e.mode==='Cash'?'Cash':'Account'}</td><td class="r">${inr(e.amount)}</td></tr>`).join('')}</table>`}
 return h}
function printStmt(){const s=S(),f=$('#r_from').value,t=$('#r_to').value;$('#print').innerHTML=`<div style="display:flex;gap:12px;align-items:center"><div style="width:56px;height:56px">${LOGO_SVG}</div><div><h2 style="margin:0">${esc(s.assoc)}</h2><div>${s.regno?'Regd. No. '+esc(s.regno)+' · ':''}${esc(s.addr)}</div></div></div><h3 style="margin:14px 0">Statement of accounts: ${fd(f)} to ${fd(t)}</h3>${stmtHTML(f,t,true)}<p style="margin-top:30px">Prepared by: ${esc(s.collector)}${s.designation?', '+esc(s.designation):''}</p><p style="color:#888;font-size:10px">${CREDIT}</p>`;window.print()}
function csv(){const qq=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=[['Type','Date','Receipt No','Particulars','Flat(s)','Towards / Category','Mode','Reference','Receipts (In)','Payments (Out)','Status']];
 const all=[];D.payments.forEach(p=>all.push(['Income',p.date,p.rcptNo||'',p.legacy&&!p.rcptNo?p.text:payerName(p),flatNos(p.flats).join(' '),period(p),p.mode,p.ref,p.amount,'',p.status]));
 D.expenses.forEach(e=>all.push(e.type==='transfer'?['Transfer',e.date,'',e.from==='Cash'?'Cash deposited to account':'Cash withdrawn','','',e.from,'','','',e.note||'']:['Expense',e.date,'',e.legacy?e.text:(e.desc+(e.paidTo?' – '+e.paidTo:'')),'',e.cat,e.mode,'','',e.amount,'']));
 all.sort((a,b)=>a[1].localeCompare(b[1]));
 const blob=new Blob(['﻿'+[...rows,...all].map(r=>r.map(qq).join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vk-accounts-'+today()+'.csv';a.click()}
function backup(){const blob=new Blob([JSON.stringify(D,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vk-accounts-backup-'+today()+'.json';a.click()}
function restore(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.settings||!Array.isArray(d.payments))throw 0;if(!confirm('Replace ALL data on this phone with this backup?'))return;D=Object.assign({settings:{},flats:[],payments:[],expenses:[],users:[]},d);saveLocal();toast('Restored');go('home')}catch(e){alert('Not a valid backup file')}};r.readAsText(file)}

/* ---------- one-time starting data ---------- */
function seedFile(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.flats)||!Array.isArray(d.ledger))throw 0;FLAT_SEED=d.flats;LEDGER_SEED=d.ledger;seedAll()}catch(e){alert('This is not the VK starting data file')}};r.readAsText(file)}
async function seedAll(){if(!confirm('Load '+FLAT_SEED.length+' flats and '+LEDGER_SEED.length+' old ledger entries (FY 2026-27)?'))return;
 const items=FLAT_SEED.map(([no,owner,addr])=>['flats',{id:'f'+no,no,owner,addr,phone:'',tenant:'',duesFrom:'',collect:true}]);
 LEDGER_SEED.forEach((e,i)=>{if(e.type==='in')items.push(['payments',{id:'L'+String(i).padStart(3,'0'),legacy:true,text:e.text,flats:(e.flats||[]).map(n=>'f'+n),payerName:'',kind:e.kind,months:[],purpose:'',amount:e.amount,mode:e.mode,ref:'',date:e.date,note:'',status:'confirmed'}]);
  else items.push(['expenses',{id:'L'+String(i).padStart(3,'0'),legacy:true,text:e.text,cat:e.cat,desc:'',paidTo:'',amount:e.amount,mode:e.mode,date:e.date}])});
 try{toast('Loading…');await DB.settings(Object.assign({},SETTINGS_SEED,S()&&S().nextNo?{nextNo:S().nextNo}:{}));await DB.batch(items);toast('Loaded ✓ Balance '+inr(bal().total))}catch(e){err(e)}}

/* ---------- start-up ---------- */
function gate(html){$('#app').innerHTML=`<div class="gate"><div class="lg">${LOGO_SVG}</div>${html}<footer>${CREDIT}</footer></div>`}
async function start(){
 if(!FIREBASE_CONFIG){loadLocal();if(!D.settings.assoc)D.settings=Object.assign({},SETTINGS_SEED);ME={email:'',name:'Admin',admin:true};READY=true;shell();render();return}
 gate('<h1>VK Accounts</h1><p>Loading…</p>');
 try{const v='10.12.2';await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-auth-compat.js`);await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore-compat.js`)}
 catch(e){gate('<h1>No internet</h1><p>Connect to the internet once to open the app.</p><button class="btn" onclick="location.reload()">Retry</button>');return}
 firebase.initializeApp(FIREBASE_CONFIG);const db=firebase.firestore();try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}
 FB={db,auth:firebase.auth()};
 FB.auth.getRedirectResult().catch(e=>toast(e.message));
 let unsub=[];
 FB.auth.onAuthStateChanged(async u=>{unsub.forEach(f=>f());unsub=[];READY=false;
  if(!u){gate(`<h1>${esc(SETTINGS_SEED.assoc)}</h1><p>Accounts, maintenance dues and receipts. Sign in with the Google account the admin gave access to.</p><button class="btn" onclick="signIn()">Sign in with Google</button>`);return}
  const em=(u.email||'').toLowerCase();ME={email:em,name:u.displayName||em,admin:em===ADMIN_EMAIL.toLowerCase(),post:''};
  if(!ME.admin){let ok=false;try{const d=await db.collection('users').doc(em).get();ok=d.exists;if(ok)ME.post=d.data().post||''}catch(e){ok=false}
   if(!ok){gate(`<h1>No access yet</h1><p>You're signed in as <b>${esc(em)}</b>. Ask the admin to add this Gmail under More → Office bearers, then tap Retry.</p><button class="btn" onclick="location.reload()">Retry</button><button class="btn" style="background:transparent;color:#fff;border:1px solid #fff" onclick="FB.auth.signOut()">Use another account</button>`);return}}
  let got=0;const need=5;const done=()=>{if(++got===need){READY=true;shell();render()}};
  const once=fn=>{let first=true;return s=>{fn(s);if(first){first=false;done()}else render()}};
  const onErr=e=>{console.error(e);gate(`<h1>Can't load data</h1><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">Retry</button>`)};
  unsub.push(db.collection('settings').doc('main').onSnapshot(once(d=>{D.settings=Object.assign({},SETTINGS_SEED,d.exists?d.data():{nextNo:1})}),onErr));
  ['flats','payments','expenses','users'].forEach(c=>unsub.push(db.collection(c).onSnapshot(once(s=>{D[c]=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}))}),onErr)));
 })}
async function signIn(){const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
 const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
 try{if(standalone)await FB.auth.signInWithRedirect(p);else await FB.auth.signInWithPopup(p)}catch(e){if(/popup/i.test(e.code||''))await FB.auth.signInWithRedirect(p);else toast(e.message)}}

if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
start();
</script>
