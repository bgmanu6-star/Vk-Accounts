.empty{text-align:center;color:var(--mu);padding:22px 8px;font-size:14px}
img.rc{width:100%;border-radius:10px;border:1px solid var(--line)}

.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}

footer{text-align:center;color:var(--mu);font-size:11.5px;padding:8px 0 4px}

.gcard{background:var(--card);color:var(--tx);border-radius:20px;padding:18px;width:100%;max-width:360px;text-align:left;margin-top:8px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.bar{height:8px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ok)}
.ring{display:flex;align-items:center;gap:16px}.ring svg{flex:none}

.lg-row{display:flex;align-items:center;gap:8px;font-size:12.5px}.lg-row .dot{width:10px;height:10px;border-radius:3px;flex:none}.lg-row .nm{flex:1;min-width:0;line-height:1.25}.lg-row .vv{font-weight:700;white-space:nowrap}.lg-row .pc{color:var(--mu);width:34px;text-align:right;font-size:11.5px}
.ch-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}.ch-head h3{margin:0}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:6px}

@media print{body>*:not(#print){display:none!important}#print{display:block;padding:10px;font-size:12px;color:#000}body{background:#fff;padding:0}}
</style>

 async put(col,obj){obj=clean(obj);obj.by=ME.email||'local';obj.at=Date.now();

 async nextReceiptNo(){if(FB){const ref=FB.db.collection('settings').doc('main');return FB.db.runTransaction(async t=>{const d=await t.get(ref);const x=d.data()||{};const n=+x.nextNo||1;t.set(ref,{nextNo:n+1},{merge:true});return (x.prefix??SETTINGS_SEED.prefix)+String(n).padStart(4,'0')})}

 async batch(items){/* items: [col, obj] */ if(FB){for(let i=0;i<items.length;i+=400){const b=FB.db.batch();items.slice(i,i+400).forEach(([c,o])=>{o=clean(o);o.by=ME.email;o.at=Date.now();b.set(FB.db.collection(c).doc(o.id),o)});await b.commit()}}else{items.forEach(([c,o])=>{const a=D[c];const i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;else a.push(o)});saveLocal();render()}}

/* ---------- domain helpers ---------- */
const flat=id=>D.flats.find(f=>f.id===id);
const flatsSorted=()=>D.flats.slice().sort((a,b)=>String(a.no).localeCompare(String(b.no),undefined,{numeric:true}));
const flatNos=ids=>(ids||[]).map(id=>flat(id)?.no??'?').sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true}));
function payerName(p){return p.payerName||(p.flats&&p.flats.length?flat(p.flats[0])?.owner:'')||''}
function payerLine(p){const n=flatNos(p.flats);const nm=payerName(p);return n.length?('Flat '+n.join(', ')+(nm?' – '+nm:'')):(nm||'—')}
function period(p){if(p.kind!=='Maintenance')return p.kind+(p.purpose?' – '+p.purpose:'');if(!p.months||!p.months.length)return p.text||'Maintenance';const a=p.months[0],b=p.months[p.months.length-1];return 'Maintenance for '+(a===b?ml(a):ml(a)+' to '+ml(b))}
function covers(fid,m){let pend=null;for(const p of D.payments){if(p.status==='cancelled'||p.kind!=='Maintenance'||!(p.flats||[]).includes(fid)||!(p.months||[]).includes(m))continue;if(p.status==='confirmed')return{s:'paid',p};pend=p}return pend?{s:'pend',p:pend}:{s:'no'}}
function dueFrom(f){return f.duesFrom||S().duesStart||curYM()}
function arrears(f,upto){if(f.collect===false)return[];return monthsBetween(dueFrom(f),upto||curYM()).filter(m=>covers(f.id,m).s==='no')}
function nextDue(fid){const f=flat(fid);if(!f)return curYM();let max=null;D.payments.forEach(p=>{if(p.status!=='cancelled'&&p.kind==='Maintenance'&&(p.flats||[]).includes(fid))(p.months||[]).forEach(m=>{if(!max||m>max)max=m})});const ar=arrears(f);if(ar.length)return ar[0];return max?addM(max,1):dueFrom(f)}
function bal(){let bank=+S().openBank||0,cash=+S().openCash||0;
 D.payments.forEach(p=>{if(p.status!=='confirmed')return;if(p.mode==='Cash')cash+=+p.amount;else bank+=+p.amount});
 D.expenses.forEach(e=>{const a=+e.amount;if(e.type==='transfer'){if(e.from==='Cash'){cash-=a;bank+=a}else{bank-=a;cash+=a}}else if(e.mode==='Cash')cash-=a;else bank-=a});
 return{bank,cash,total:bank+cash}}
function ledger(){const L=[];
 D.payments.forEach(p=>{if(p.status==='confirmed')L.push({d:p.date,type:'in',t:p.legacy?p.text:payerLine(p),s:(p.legacy?'Old ledger':period(p)+' · '+p.mode),a:+p.amount,rc:p.rcptNo,o:p,col:'payments'})});
 D.expenses.forEach(e=>{if(e.type==='transfer')L.push({d:e.date,type:'tr',t:e.from==='Cash'?'Cash deposited to account':'Cash withdrawn from account',s:e.note||'Transfer',a:+e.amount,o:e,col:'expenses'});
  else L.push({d:e.date,type:'out',t:e.legacy?e.text:(e.cat+(e.desc?' – '+e.desc:'')),s:(e.legacy?e.cat+' · Old ledger':(e.paidTo?e.cat+' · To '+e.paidTo:e.cat)),a:+e.amount,o:e,col:'expenses'})});
 return L.sort((x,y)=>y.d.localeCompare(x.d)||((y.o.at||0)-(x.o.at||0)))}

const CATSTY={'Security salary':['🛡️','#4a78d6'],'Sweeper salary':['🧹','#8a6fd1'],'EB bill':['⚡','#e3a925'],'Electrical work':['💡','#ef8f3a'],'Plumbing work':['🚰','#2fa3c7'],'Motor / pump':['⚙️','#5f8aa6'],'Drainage':['🌀','#6f9a4f'],'Tank / sump cleaning':['💧','#3bb3d9'],'Metro water / Corporation':['🏛️','#3f9488'],'Civil / repair work':['🧱','#c8765a'],'Supplies / consumables':['🧴','#d083b1'],'Festival bonus':['🎉','#e0644b'],'Bank charges':['🏦','#7c8494'],'Other':['📦','#9aa096']};

const icn=(emo,col)=>`<div class="ic" style="background:${col}22">${emo}</div>`;
function donut(segs,size,thick,center){const r=(size-thick)/2,C=2*Math.PI*r,tot=segs.reduce((s,x)=>s+x.v,0)||1;let acc=0;
 const arcs=segs.filter(x=>x.v>0).map(x=>{const len=x.v/tot*C;const gap=segs.length>1&&len>4?2:0;const el=`<circle r="${r}" cx="${size/2}" cy="${size/2}" fill="none" stroke="${x.c}" stroke-width="${thick}" stroke-dasharray="${Math.max(len-gap,0.01)} ${C}" stroke-dashoffset="${-acc}" stroke-linecap="butt"/>`;acc+=len;return el}).join('');
 return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><g transform="rotate(-90 ${size/2} ${size/2})"><circle r="${r}" cx="${size/2}" cy="${size/2}" fill="none" stroke="var(--card2)" stroke-width="${thick}"/>${arcs}</g>${center||''}</svg>`}
function ctext(size,a,b){return `<text x="50%" y="${size/2-2}" text-anchor="middle" font-size="${size>120?20:17}" font-weight="800" fill="var(--tx)">${a}</text><text x="50%" y="${size/2+15}" text-anchor="middle" font-size="10.5" fill="var(--mu)">${b}</text>`}
const kfmt=n=>n>=1e5?'₹'+(n/1e5).toFixed(n>=1e6?0:1).replace(/\.0$/,'')+'L':n>=1000?'₹'+(n/1000).toFixed(n>=1e4?0:1).replace(/\.0$/,'')+'k':'₹'+Math.round(n);
function expByCat(from,to){const m={};D.expenses.forEach(e=>{if(e.type==='transfer'||e.date<from||e.date>to)return;m[e.cat||'Other']=(m[e.cat||'Other']||0)+ +e.amount});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function expDonutCard(from,to,title,toggle){const list=expByCat(from,to);const tot=list.reduce((s,x)=>s+x[1],0);
 let top=list.slice(0,5);const rest=list.slice(5).reduce((s,x)=>s+x[1],0);if(rest)top.push(['Others',rest]);
 const segs=top.map(([k,v])=>({v,c:k==='Others'?'#b9bdb5':catSty(k)[1]}));
 return `<div class="card"><div class="ch-head"><h3>${title}</h3>${toggle||''}</div>${tot?`<div class="ring">${donut(segs,132,20,ctext(132,kfmt(tot),'spent'))}<div class="legend">${top.map(([k,v])=>`<div class="lg-row"><span class="dot" style="background:${k==='Others'?'#b9bdb5':catSty(k)[1]}"></span><span class="nm">${esc(k)}</span><span class="vv">${inr(v)}</span><span class="pc">${Math.round(v/tot*100)}%</span></div>`).join('')}</div></div>`:'<div class="empty">No expenses in this period 🎉</div>'}</div>`}
function trendCard(){const end=curYM();const ms=[];for(let i=5;i>=0;i--)ms.push(addM(end,-i));
 const inc={},out={};ms.forEach(m=>{inc[m]=0;out[m]=0});
 D.payments.forEach(p=>{if(p.status==='confirmed'){const m=p.date.slice(0,7);if(m in inc)inc[m]+= +p.amount}});
 D.expenses.forEach(e=>{if(e.type!=='transfer'){const m=e.date.slice(0,7);if(m in out)out[m]+= +e.amount}});
 const mx=Math.max(1,...ms.map(m=>Math.max(inc[m],out[m])));
 return `<div class="card"><div class="ch-head"><h3>Last 6 months</h3><span class="muted">income vs expenses</span></div><div class="bars">${ms.map(m=>`<div class="bc" title="${ml(m)}: +${inr(inc[m])} / −${inr(out[m])}"><div class="bp"><i style="height:${inc[m]/mx*100}%;background:var(--ok)"></i><i style="height:${out[m]/mx*100}%;background:var(--bad);opacity:.85"></i></div><span class="bl">${MON[+m.slice(5)-1]}</span></div>`).join('')}</div><div class="key"><span style="--c:var(--ok)">Income</span><span style="--c:var(--bad)">Expenses</span></div></div>`}

function lines(g,text,maxW){const ws=String(text||'').split(' ');const out=[];let line='';for(const w of ws){const t=line?line+' '+w:w;if(g.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t}out.push(line);return out}

 g.textAlign='center';g.fillStyle='#fff';g.font='bold 32px sans-serif';let y=wrap(g,s.assoc,W/2,160,W-100,40);
 g.font='20px sans-serif';g.fillStyle='#d6e9df';if(s.regno){g.fillText('Regd. No. '+s.regno,W/2,y);y+=28}if(s.addr)wrap(g,s.addr,W/2,y,W-140,26);
 y=hh+64;g.fillStyle='#1f5f4a';g.font='bold 30px sans-serif';g.fillText(p.kind==='Maintenance'?'MAINTENANCE RECEIPT':'RECEIPT',W/2,y);y+=48;
 g.textAlign='left';const nos=flatNos(p.flats);

 rows.push(['Towards',period(p)],['Payment mode',p.mode+(p.ref?' (Ref: '+p.ref+')':'')],['Paid on',fd(p.date)]);if(p.note)rows.push(['Note',p.note]);

 g.font='22px sans-serif';g.fillStyle='#1b2420';wrap(g,'Rupees '+words(p.amount)+' Only',W/2,by+120,W-180,28);y=by+225;
 g.font='22px sans-serif';y=wrap(g,'Received with thanks.',W/2,y,W-120,30)+20;

 if(p.status==='cancelled'){g.save();g.translate(W/2,y/2+60);g.rotate(-0.45);g.font='bold 130px sans-serif';g.fillStyle='rgba(192,57,43,.28)';g.fillText('CANCELLED',0,0);g.restore()}
 const o=document.createElement('canvas');o.width=W;o.height=y;const og=o.getContext('2d');og.drawImage(c,0,0);og.strokeStyle='#1f5f4a';og.lineWidth=6;og.strokeRect(3,3,W-6,y-6);return o}

function stmtData(from,to){let open=(+S().openBank||0)+(+S().openCash||0);const inc=[],exp=[];

 const ti=inc.reduce((s,p)=>s+ +p.amount,0),te=exp.reduce((s,e)=>s+ +e.amount,0);const byCat={},byKind={};exp.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+ +e.amount);inc.forEach(p=>byKind[p.kind]=(byKind[p.kind]||0)+ +p.amount);
 return{open,inc:inc.sort((a,b)=>a.date.localeCompare(b.date)),exp:exp.sort((a,b)=>a.date.localeCompare(b.date)),ti,te,byCat,byKind,close:open+ti-te}}

const MONF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const dmy=iso=>{const[y,m,d]=iso.split('-');return d+'.'+m+'.'+y.slice(2)};
const dmyy=iso=>{const[y,m,d]=iso.split('-');return d+'.'+m+'.'+y};
function monRange(ms){if(!ms||!ms.length)return'';const a=ms[0],b=ms[ms.length-1],sm=x=>MON[+x.slice(5)-1],yy=x=>x.slice(2,4);
 if(a===b)return sm(a)+' '+yy(a);return a.slice(0,4)===b.slice(0,4)?sm(a)+'-'+sm(b)+' '+yy(b):sm(a)+' '+yy(a)+'-'+sm(b)+' '+yy(b)}
function particulars(r){const o=r.o;
 if(r.col==='payments'){if(o.legacy&&!o.rcptNo&&!(o.months||[]).length)return o.text;const nos=flatNos(o.flats);
  let t;if(o.kind==='Maintenance'&&nos.length){t='Flat '+nos.join(',')+' maintenance';const ms=o.months||[];if(ms.length>1||(ms.length===1&&ms[0]!==o.date.slice(0,7)))t+=' ('+monRange(ms)+')'}
  else t=(o.kind==='Maintenance'?'Maintenance':o.kind)+(o.purpose?' - '+o.purpose:'')+(payerName(o)?' from '+payerName(o):'')+(nos.length&&o.kind!=='Maintenance'?' (Flat '+nos.join(',')+')':'');
  if(o.mode==='Cash')t+=' (cash)';return t}
 if(o.legacy)return o.text;return o.desc||o.cat}

function xCell(ref,st,v){if(v===null||v===undefined||v==='')return `<c r="${ref}" s="${st}"/>`;

function ledgerSheet(name,title,from,to){
 /* styles: 1 title,2 header,3 bold-centre,4 text,5 balance,6 number,7 total label,8 total balance,9 total number */
 const rows=[];const R=(cells,ht)=>rows.push({cells,ht});
 R([[1,title],[1,null],[1,null],[1,null],[1,null]],15);
 R(['Date','Particulars','Receipts','Payments','Cash on hand'].map(v=>[2,v]),18);
 const open=stmtData(from,to).open;R([[4,null],[3,'Previous Balance'],[6,null],[6,null],[5,open]]);
 let bal=open,last=null,rn=4,tin=0,tout=0;
 ledgerRows(from,to).forEach(r=>{const inc=r.type==='in'?r.a:null,out=r.type==='out'?r.a:null;bal+=(inc||0)-(out||0);tin+=inc||0;tout+=out||0;

const payerKey=n=>String(n||'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function parseBankSms(t){t=String(t||'').replace(/\s+/g,' ');
 const am=t.match(/(?:Rs\.?|INR|₹)\s*([\d,]+(?:\.\d{1,2})?)/i);if(!am)return null;

 const fr=t.match(/\bfrom\s+(.+?)\s+on\s+\d/i)||t.match(/\bby\s+(.+?)(?:\s+on\s+\d|\.|\s+UPI|$)/i)||t.match(/\bfrom\s+([A-Za-z0-9@._ -]+?)(?:\.|,|\s+UPI|$)/i);

 const rf=t.match(/(?:UPI\s*Ref(?:\s*No)?|Ref(?:erence)?\s*No|UTR)[:.\s#-]*([0-9]{8,})/i)||t.match(/\b(\d{12})\b/);
 let date='';if(dt){const y=dt[3].length===2?'20'+dt[3]:dt[3];date=y+'-'+dt[2]+'-'+dt[1]}
 return{amt,from:fr?fr[1].trim():'',ref:rf?rf[1]:'',date:/^\d{4}-\d{2}-\d{2}$/.test(date)?date:today()}}

 go('receipts');payForm(null,null,pre)}

async function emailSignIn(){const{em,pw}=lgVals();if(!em||!pw)return toast('Enter email and password');const v=lgVals();try{await FB.auth.signInWithEmailAndPassword(em,pw)}catch(e){loginGate(authErr(e));$('#lg_em').value=v.em}}
async function emailCreate(){const{em,pw}=lgVals();if(!em||pw.length<6)return toast('Enter your email and a password (min 6 characters)');
 try{const c=await FB.auth.createUserWithEmailAndPassword(em,pw);await c.user.sendEmailVerification();toast('Verification link sent to '+em)}catch(e){loginGate(authErr(e));$('#lg_em').value=em}}
async function forgotPw(){const{em}=lgVals();if(!em)return toast('Type your email first');try{await FB.auth.sendPasswordResetEmail(em);loginGate('A link to set a new password was sent to '+esc(em)+'. Open it, set the password, then sign in here.');$('#lg_em').value=em}catch(e){loginGate(authErr(e))}}
async function afterVerify(){const u=FB.auth.currentUser;if(!u)return location.reload();await u.reload();if(!u.emailVerified)return toast('Not verified yet – tap the link in your email first');await u.getIdToken(true);location.reload()}
async function signIn(){const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
 try{await FB.auth.signInWithPopup(p)}catch(e){if(/popup-blocked|operation-not-supported/i.test(e.code||''))await FB.auth.signInWithRedirect(p);else if(!/popup-closed|cancelled-popup/i.test(e.code||''))toast(e.message)}}

if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
start();
</script>
